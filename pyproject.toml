[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emvb"
version = "1.1"
description = "Comparaison de l'EM classique et de l'EM variationnel pour les modèles de mélange (mémoire de Master, ENSPD)"
requires-python = ">=3.10"
authors = [{ name = "KANA TIODONG Icare Brichel" }]
readme = "README.md"
dependencies = ["torch==2.4.1", "plotly==6.8.0", "kaleido==1.3.0"]

[project.optional-dependencies]
demo = ["dash==3.2.0"]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["emvb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
